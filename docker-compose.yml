name: gophermart

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gophermart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophermart}
      POSTGRES_DB: ${POSTGRES_DB:-gophermart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build: .
    environment:
      RUN_ADDRESS: :8080
      DATABASE_URI: postgres://gophermart:gophermart@postgres:5432/gophermart?sslmode=disable
      ACCRUAL_SYSTEM_ADDRESS: ${ACCRUAL_SYSTEM_ADDRESS:-http://localhost:8081}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret}
    ports:
      - "${RUN_PORT:-8080}:8080"
    depends_on:
      - postgres
